<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Checker - all Adapters</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            background: #fff; border-radius: 12px; padding: 30px 40px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%; max-width: 700px;
        }
        .icon { font-size: 3em; margin-bottom: 10px; text-align: center; }
        h1 { color: #333; text-align: center; margin-bottom: 8px; }
        .description { text-align: center; color: #666; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        input {
            width: 100%; padding: 10px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;
        }
        .help-text { margin-top: 4px; font-size: 12px; color: #666; }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px; background: #667eea; color: #fff;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        .status-message { margin: 16px 0; padding: 10px 12px; border-radius: 8px; display: none; }
        .status-message.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .status-message.error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .progress-container { display: none; margin: 16px 0; }
        .progress-step { margin: 8px 0; padding: 10px; border-radius: 8px; background: #f7fafc; }
        .progress-step.running { background: #ebf8ff; }
        .progress-step.success { background: #f0fff4; }
        .progress-step.error { background: #fff5f5; }
        .progress-step-title { font-weight: 600; margin-bottom: 4px; }
        .progress-step-link { color: #667eea; text-decoration: none; }
        .progress-step-link:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-top: 14px; color: #667eea; text-decoration: none; font-weight: 600; margin-right: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>Repository Checker - all Adapters</h1>
        <p class="description">Trigger checks for latest adapter repositories.</p>

        <div id="statusMessage" class="status-message"></div>
        <div id="progressContainer" class="progress-container">
            <div id="step1" class="progress-step"><div class="progress-step-title">1. Triggering workflow</div><div class="progress-step-status">Pending...</div></div>
            <div id="step2" class="progress-step"><div class="progress-step-title">2. Waiting for intermediate workflow</div><div class="progress-step-status">Pending...</div></div>
            <div id="step3" class="progress-step"><div class="progress-step-title">3. Waiting for check workflow</div><div class="progress-step-status">Pending...</div></div>
        </div>

        <form id="form">
            <div class="form-group">
                <label for="filter">Filter (Optional)</label>
                <input id="filter" name="filter" type="text" placeholder="owner/* or */ioBroker.*">
            </div>
            <div class="form-group">
                <label for="flags">Flags (Optional)</label>
                <input id="flags" name="flags" type="text" placeholder="Optional flags">
            </div>
            <div class="form-group">
                <label for="from">From (Optional)</label>
                <input id="from" name="from" type="text" placeholder="Resume from adapter name">
            </div>
            <div class="form-group">
                <label for="delay">Delay (seconds)</label>
                <input id="delay" name="delay" type="text" value="30">
                <div class="help-text">Default: 30</div>
            </div>
            <button id="executeBtn" type="submit">Execute</button>
        </form>

        <a href="index.html" class="back-link">← Back to Tools</a>
        <a href="check-repository-all-adapters.html" class="back-link">↻ Restart Tool</a>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('form');
        const executeBtn = document.getElementById('executeBtn');
        const statusMessage = document.getElementById('statusMessage');
        const progressContainer = document.getElementById('progressContainer');

        function formatGitHubToken(token) {
            if (!token) return null;
            const hasPrefix = token.startsWith('github_pat_') || token.startsWith('ghp_') || token.startsWith('gho_') || token.startsWith('ghu_') || token.startsWith('ghs_') || token.startsWith('ghr_');
            return hasPrefix ? token : `github_pat_${token}`;
        }

        function buildGitHubHeaders(token) {
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        function createSafeLink(url, text, className) {
            try {
                const parsedUrl = new URL(url);
                if (parsedUrl.protocol !== 'https:' || (parsedUrl.hostname !== 'github.com' && parsedUrl.hostname !== 'api.github.com')) return text;
            } catch {
                return text;
            }
            const link = document.createElement('a');
            link.href = url;
            link.textContent = text;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = className;
            return link.outerHTML;
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
        }

        function updateProgressStep(stepId, status, statusText) {
            const step = document.getElementById(stepId);
            step.className = `progress-step ${status}`;
            const el = step.querySelector('.progress-step-status');
            if (typeof statusText === 'string' && statusText.includes('<a ') && statusText.includes('noopener noreferrer')) {
                el.innerHTML = statusText;
            } else {
                el.textContent = statusText;
            }
        }

        async function waitForWorkflowRun(owner, repo, workflowId, token, startTime, timeout = 120000, knownRunId = null) {
            if (knownRunId) {
                const byIdResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${knownRunId}?_=${Date.now()}`, { headers: buildGitHubHeaders(token), cache: 'no-store' });
                if (byIdResponse.ok) return { success: true, run: await byIdResponse.json() };
            }

            const adjustedStartTime = startTime - 10000;
            const endTime = Date.now() + timeout;
            while (Date.now() < endTime) {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflowId}/runs?per_page=5&_=${Date.now()}`, { headers: buildGitHubHeaders(token), cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();
                    const run = data.workflow_runs.find(r => new Date(r.created_at).getTime() >= adjustedStartTime);
                    if (run) return { success: true, run };
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            return { success: false, error: 'Timeout waiting for workflow to start' };
        }

        async function monitorWorkflowRun(owner, repo, runId, token, timeout = 300000) {
            const endTime = Date.now() + timeout;
            while (Date.now() < endTime) {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}?_=${Date.now()}`, { headers: buildGitHubHeaders(token), cache: 'no-store' });
                if (response.ok) {
                    const run = await response.json();
                    if (run.status === 'completed') return { success: true, run, conclusion: run.conclusion };
                }
                await new Promise(resolve => setTimeout(resolve, 3000));
            }
            return { success: false, error: 'Timeout waiting for workflow to complete' };
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            executeBtn.disabled = true;
            progressContainer.style.display = 'block';
            updateProgressStep('step1', 'running', 'Triggering workflow...');
            updateProgressStep('step2', 'pending', 'Pending...');
            updateProgressStep('step3', 'pending', 'Pending...');
            statusMessage.style.display = 'none';

            try {
                const config = window.REPO_CHECKER_CONFIG;
                const token = config?.GITHUB_TOKEN ? formatGitHubToken(config.GITHUB_TOKEN) : null;
                if (!token) throw new Error('Configuration incomplete: GitHub token not set.');

                const startTime = Date.now();
                const inputs = {
                    filter: document.getElementById('filter').value.trim(),
                    flags: document.getElementById('flags').value.trim(),
                    from: document.getElementById('from').value.trim(),
                    delay: document.getElementById('delay').value.trim() || '30'
                };

                const response = await fetch(`https://api.github.com/repos/${config.OWNER}/${config.REPO}/actions/workflows/${config.CHECK_LATEST_WORKFLOW_ID}/dispatches`, {
                    method: 'POST',
                    headers: { ...buildGitHubHeaders(token), 'Content-Type': 'application/json' },
                    cache: 'no-store',
                    body: JSON.stringify({ ref: 'main', inputs })
                });
                if (response.status !== 204 && response.status !== 200) throw new Error(`Failed to trigger workflow (HTTP ${response.status})`);

                let workflowRunId = null;
                if (response.status === 200) {
                    const body = await response.json().catch(() => ({}));
                    workflowRunId = body.workflow_run_id || null;
                }
                updateProgressStep('step1', 'success', 'Workflow triggered successfully');

                updateProgressStep('step2', 'running', 'Waiting for intermediate workflow...');
                const localRun = await waitForWorkflowRun(config.OWNER, config.REPO, config.CHECK_LATEST_WORKFLOW_ID, token, startTime, 120000, workflowRunId);
                if (!localRun.success) throw new Error(localRun.error);
                const localLink = createSafeLink(localRun.run.html_url, `${config.OWNER}/${config.REPO}#${localRun.run.id}`, 'progress-step-link');
                const localFinished = await monitorWorkflowRun(config.OWNER, config.REPO, localRun.run.id, token, 300000);
                if (!localFinished.success || localFinished.conclusion !== 'success') throw new Error('Intermediate workflow failed');
                updateProgressStep('step2', 'success', `Intermediate workflow completed (${localLink})`);

                updateProgressStep('step3', 'running', 'Waiting for check workflow...');
                const targetRun = await waitForWorkflowRun(config.CHECK_TASKS_OWNER, config.CHECK_TASKS_REPO, config.CHECK_TASKS_LATEST_WORKFLOW_ID, token, startTime, 180000);
                if (!targetRun.success) {
                    updateProgressStep('step3', 'running', 'Target workflow has been triggered. Check Actions manually.');
                    showStatus('Repository check workflow has been triggered.', 'success');
                } else {
                    const targetLink = createSafeLink(targetRun.run.html_url, `${config.CHECK_TASKS_OWNER}/${config.CHECK_TASKS_REPO}#${targetRun.run.id}`, 'progress-step-link');
                    updateProgressStep('step3', 'success', `Target workflow started (${targetLink})`);
                    showStatus('Repository check workflow has been triggered successfully.', 'success');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                executeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
