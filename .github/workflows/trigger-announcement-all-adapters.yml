name: Trigger Announcement - all Adapters

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Name of the template'
        required: true
        type: string
      filter:
        description: 'Filter repositories by owner/name pattern (optional)'
        required: false
        type: string
      flags:
        description: 'Optional flags to pass to the workflow'
        required: false
        type: string
      from:
        description: 'Resume processing from this adapter name (optional)'
        required: false
        type: string
      delay:
        description: 'Delay in seconds between processing each repository'
        required: false
        type: string
        default: '120'

jobs:
  trigger-announcement-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate template input
        shell: bash
        run: |
          TEMPLATE="${{ github.event.inputs.template }}"
          if [[ -z "$TEMPLATE" ]]; then
            echo "Error: Template is required"
            exit 1
          fi

      - name: Trigger announce-latest workflow
        shell: bash
        run: |
          TEMPLATE="${{ github.event.inputs.template }}"
          FILTER="${{ github.event.inputs.filter || '' }}"
          FLAGS="${{ github.event.inputs.flags || '' }}"
          FROM="${{ github.event.inputs.from || '' }}"
          DELAY="${{ github.event.inputs.delay || '120' }}"

          JSON_PAYLOAD=$(jq -n \
            --arg template "$TEMPLATE" \
            --arg filter "$FILTER" \
            --arg flags "$FLAGS" \
            --arg from "$FROM" \
            --arg delay "$DELAY" \
            '{
              ref: "main",
              inputs: {
                template: $template,
                filter: $filter,
                flags: $flags,
                from: $from,
                delay: $delay
              }
            }')

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/iobroker-bot-orga/announcements/actions/workflows/announceLatestRepositories.yml/dispatches \
            -d "$JSON_PAYLOAD"

