name: Trigger Manage PR - all Adapters

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Name of the template'
        required: true
        type: string
      filter:
        description: 'Filter repositories by owner/name pattern (optional)'
        required: false
        type: string
      pr_mode:
        description: 'PR mode for handling existing PRs'
        required: false
        type: choice
        default: 'recreate'
        options:
          - 'force creation'
          - 'recreate'
          - 'skip if existing'
          - 'skip if closed'
          - 'skip if merged'
          - 'REVOKE'
      parameter_data:
        description: 'Optional parameter data to pass to the template'
        required: false
        type: string
      flags:
        description: 'Optional flags to pass to the workflow'
        required: false
        type: string
      from:
        description: 'Resume processing from this adapter name (optional)'
        required: false
        type: string
      delay:
        description: 'Delay in seconds between processing each repository'
        required: false
        type: string
        default: '120'

jobs:
  trigger-manage-pr-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate template input
        shell: bash
        run: |
          TEMPLATE="${{ github.event.inputs.template }}"
          if [[ -z "$TEMPLATE" ]]; then
            echo "Error: Template is required"
            exit 1
          fi

      - name: Trigger process-latest workflow
        shell: bash
        run: |
          TEMPLATE="${{ github.event.inputs.template }}"
          FILTER="${{ github.event.inputs.filter || '' }}"
          PR_MODE="${{ github.event.inputs.pr_mode || 'recreate' }}"
          PARAMETER_DATA="${{ github.event.inputs.parameter_data || '' }}"
          FLAGS="${{ github.event.inputs.flags || '' }}"
          FROM="${{ github.event.inputs.from || '' }}"
          DELAY="${{ github.event.inputs.delay || '120' }}"

          JSON_PAYLOAD=$(jq -n \
            --arg template "$TEMPLATE" \
            --arg filter "$FILTER" \
            --arg pr_mode "$PR_MODE" \
            --arg parameter_data "$PARAMETER_DATA" \
            --arg flags "$FLAGS" \
            --arg from "$FROM" \
            --arg delay "$DELAY" \
            '{
              ref: "main",
              inputs: {
                template: $template,
                filter: $filter,
                pr_mode: $pr_mode,
                parameter_data: $parameter_data,
                flags: $flags,
                from: $from,
                delay: $delay
              }
            }')

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/iobroker-bot-orga/manage-prs/actions/workflows/processLatestRepositories.yml/dispatches \
            -d "$JSON_PAYLOAD"

