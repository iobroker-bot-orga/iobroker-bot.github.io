<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ioBroker Bot - Login">
    <title>Login - ioBroker Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        .description {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: monospace;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            color: #999;
            font-size: 0.88em;
            margin-top: 6px;
            line-height: 1.4;
        }

        .help-text a {
            color: #667eea;
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        .show-token-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 0.88em;
            color: #666;
            user-select: none;
        }

        .show-token-toggle input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button[type="submit"]:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .github-login-btn {
            width: 100%;
            padding: 13px;
            background: #24292f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-bottom: 16px;
        }

        .github-login-btn:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .github-login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-alternative {
            margin: 18px 0;
            text-align: center;
            color: #666;
            font-size: 0.88em;
        }

        .status-message {
            display: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.9em;
            margin-top: 16px;
            line-height: 1.4;
        }

        .status-message.error {
            background: #fef2f2;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.success {
            background: #f0fff4;
            color: #27ae60;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.info {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            display: block;
        }

        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 28px 0 20px;
        }

        .token-instructions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            font-size: 0.88em;
            color: #555;
            line-height: 1.6;
        }

        .token-instructions strong {
            color: #333;
        }

        .token-instructions ol {
            padding-left: 18px;
            margin-top: 8px;
        }

        .token-instructions li {
            margin-bottom: 4px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.5);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Sign in</h1>
        <p class="description">
            Authenticate with your GitHub account to access ioBroker Bot tools.
        </p>

        <div id="githubLoginSection" style="display:none;">
            <button type="button" id="githubLoginBtn" class="github-login-btn">Continue with GitHub</button>
            <div class="help-text" style="margin-top:-8px;">
                Sign in on GitHub with your username, password, and any configured 2FA.
                Your access is remembered in this browser until you explicitly log out.
            </div>
            <div class="status-message" id="statusMessage" role="alert" aria-live="polite"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (function () {
            'use strict';

            const githubLoginBtn    = document.getElementById('githubLoginBtn');
            const githubLoginSection = document.getElementById('githubLoginSection');
            const statusMsg         = document.getElementById('statusMessage');
            const config            = window.AUTH_CONFIG || window.REPO_CHECKER_CONFIG || null;
            const requireAuth       = !!(config && config.REQUIRE_AUTH);
            const hasSessionLogin   = !!(config && config.AUTH_LOGIN_URL && config.AUTH_SESSION_URL);

            // Authentication is disabled — redirect immediately to the target page
            if (!requireAuth) {
                window.location.replace(window.AUTH.getRedirectTarget());
                return;
            }

            if (hasSessionLogin) {
                githubLoginSection.style.display = 'block';
            } else {
                githubLoginSection.style.display = 'block';
                githubLoginBtn.disabled = true;
                showStatus(
                    'GitHub login is not configured yet. Please set AUTH_LOGIN_URL, AUTH_SESSION_URL, and AUTH_LOGOUT_URL in config.js.',
                    'error'
                );
            }

            function showStatus(message, type) {
                statusMsg.textContent = message;
                statusMsg.className   = 'status-message ' + type;
            }

            function setGitHubLoginLoading(loading) {
                if (!githubLoginBtn) {
                    return;
                }

                if (loading) {
                    githubLoginBtn.disabled  = true;
                    githubLoginBtn.innerHTML = '<span class="spinner"></span>Redirecting…';
                } else {
                    githubLoginBtn.disabled  = false;
                    githubLoginBtn.innerHTML = 'Continue with GitHub';
                }
            }

            async function restoreExistingAuth() {
                const authMode = window.AUTH.getAuthMode();
                const authUser = window.AUTH.getAuthUser();

                if (authUser && authMode === 'session') {
                    window.location.replace(window.AUTH.getRedirectTarget());
                    return;
                }

                if (!hasSessionLogin) {
                    return;
                }

                setGitHubLoginLoading(true);
                const sessionResult = await window.AUTH.fetchSession();
                setGitHubLoginLoading(false);

                if (sessionResult.success) {
                    window.AUTH.setAuth('', sessionResult.user, { mode: 'session', persist: true });
                    showStatus('GitHub session detected. Redirecting…', 'success');
                    window.location.replace(window.AUTH.getRedirectTarget());
                    return;
                }
            }

            if (githubLoginBtn) {
                githubLoginBtn.addEventListener('click', function () {
                    const loginUrl = window.AUTH.getLoginUrl(window.AUTH.getRedirectTarget());
                    if (!loginUrl) {
                        showStatus('GitHub web login is not configured yet.', 'error');
                        return;
                    }

                    setGitHubLoginLoading(true);
                    showStatus('Redirecting to GitHub…', 'info');
                    window.location.assign(loginUrl);
                });
            }

            restoreExistingAuth().catch(function () {
                setGitHubLoginLoading(false);
                if (hasSessionLogin) {
                    showStatus('Unable to restore the GitHub session. Please sign in again.', 'info');
                }
            });
        }());
    </script>
</body>
</html>
